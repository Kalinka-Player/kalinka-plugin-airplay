name: Companion Kalinka core
description: Check out the Kalinka core with SDK 3.11 (DirectPlaybackSession.show, live_capture) into ./core.
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: Kalinka-Player/KalinkaPlayer
        # The oldest server release with SDK 3.11.
        ref: kalinka-v5.9.0
        path: core
        fetch-depth: 0
