[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "kalinka-plugin-airplay"
dynamic = ["version"]
description = "AirPlay receiver input for Kalinka"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["kalinka-plugin-sdk>=3.11,<4", "httpx>=0.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "fastapi", "build", "ruff"]

[project.entry-points."kalinka.plugins"]
kalinka_plugin_airplay = "kalinka_plugin_airplay:KalinkaPluginAirPlay"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
tag_regex = "^kalinka-plugin-airplay-v(?P<version>\\d+\\.\\d+\\.\\d+)$"
git_describe_command = "git describe --dirty --tags --long --match kalinka-plugin-airplay-v*"
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
fallback_version = "0.1.0.dev0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
